[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iron-spyder"
version = "0.2.0"
description = "SPY-DER: SPY defined-risk options intelligence, prediction, and strategy optimization"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "pyyaml>=6.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.32"]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "mypy>=1.11",
  "httpx>=0.27",
  "types-PyYAML>=6.0",
]

[project.scripts]
spyder-demo = "scripts.demo:main"
spyder-paper = "scripts.paper_trade:main"
spyder-backtest = "scripts.backtest:main"

[tool.setuptools.packages.find]
include = ["spy_der*", "scripts*"]

[tool.setuptools.package-data]
"spy_der.config" = ["*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = [
  "E501",   # long lines are handled by the formatter, not enforced here
  "B008",   # FastAPI dependency defaults are the framework's idiom
  # Many zips intentionally pair a sequence with its own offset slice
  # (zip(xs, xs[1:]) to walk adjacent pairs), where strict=True is wrong.
  "B905",
  # str+Enum is kept over StrEnum: every call site uses `.value` explicitly and
  # the mixin form keeps repr stable across the JSON audit payloads.
  "UP042",
  "C408",   # dict(...) reads better than a literal when merging test kwargs
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.mypy]
# Deliberately unpinned. The package supports 3.11+, but numpy's stubs use PEP
# 695 `type` statements that only parse under 3.12, so pinning python_version
# to 3.11 makes mypy reject numpy's own stub file on a 3.12 runner. Letting
# mypy target the interpreter it runs under keeps the check working on both.
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
