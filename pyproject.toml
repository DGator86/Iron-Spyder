[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iron-spyder"
version = "0.1.0"
description = "SPY defined-risk options research and paper-trading foundation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "streamlit>=1.38",
  "pydantic>=2.8",
  "sqlalchemy>=2.0",
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "pyyaml>=6.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.5",
  "mypy>=1.11",
  "httpx>=0.27"
]

[tool.setuptools]
packages = [
  "app","config","data","analytics","features","models","simulation",
  "strategies","optimizer","risk","execution","backtest","monitoring","scripts"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
